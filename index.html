<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="icon" type="image/png" href="images/logo.png" />
<title>Flappy Modi</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app" data-theme="day">

  <!-- ===================== HOME SCREEN ===================== -->
  <section id="home-screen" class="screen active">
    <div class="home-inner">
      <h1 class="game-title">FLAPPY <span>MODI</span></h1>
      <img class="game-logo" src="images/logo.png" alt="Flappy Modi logo" />

      <button id="play-btn" class="btn-primary">
        <span class="btn-icon">▶</span> PLAY
      </button>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Best Score</span>
          <span class="stat-value" id="home-best-score">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Coins</span>
          <span class="stat-value coin-value"><span class="coin-dot"></span><span id="home-coins">0</span></span>
        </div>
      </div>

      <div class="picker-section">
        <div class="picker-header">
          <h2>Theme</h2>
          <span class="picker-hint">Tap to select · locked themes cost coins</span>
        </div>
        <div id="theme-list" class="picker-row"></div>
      </div>

      <div class="picker-section">
        <div class="picker-header">
          <h2>Vehicle</h2>
          <span class="picker-hint">Tap to select · locked vehicles cost coins</span>
        </div>
        <div id="vehicle-list" class="picker-row"></div>
      </div>

      <p class="footer-note">Tap / Click / Space to flap</p>
    </div>
  </section>

  <!-- ===================== GAME SCREEN ===================== -->
  <section id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div id="hud-score">0</div>
      <button id="pause-btn" aria-label="Pause">II</button>
    </div>

    <div id="get-ready-overlay" class="overlay">
      <div class="overlay-card">
        <h2>Get Ready</h2>
        <p>Tap anywhere to flap</p>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2>Paused</h2>
        <button id="resume-btn" class="btn-primary small">Resume</button>
        <button id="pause-home-btn" class="btn-secondary small">Home</button>
      </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2>Game Over</h2>
        <div class="go-stats">
          <div class="go-stat">
            <span class="go-label">Score</span>
            <span class="go-value" id="go-score">0</span>
          </div>
          <div class="go-stat">
            <span class="go-label">Best</span>
            <span class="go-value" id="go-best">0</span>
          </div>
          <div class="go-stat">
            <span class="go-label">Coins earned</span>
            <span class="go-value coin-value"><span class="coin-dot"></span><span id="go-coins">0</span></span>
          </div>
        </div>
        <div class="go-btn-row">
          <button id="retry-btn" class="btn-primary small">Retry</button>
          <button id="go-home-btn" class="btn-secondary small">Home</button>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- ===================== AUDIO ===================== -->
<audio id="audio-jump" src="audio/jump.mp3" preload="auto"></audio>
<audio id="audio-bgm" src="audio/bgm.mp3" preload="auto" loop></audio>
<audio id="audio-gameover" src="audio/gameover.mp3" preload="auto"></audio>
<audio id="audio-start" src="audio/start.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
